<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOKLIM STREAM - វេទិកាភាពយន្ត</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f0f10; color: #f4f4f5; min-height: 100vh; display: flex; flex-direction: column; }

    .marquee-bar {
      background: #18181b;
      color: #e4e4e7;
      font-size: 13px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      white-space: nowrap;
    }
    .marquee-text { display: inline-block; animation: scroll-left 25s linear infinite; }
    .marquee-text:hover { animation-play-state: paused; }
    @keyframes scroll-left { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

    header {
      background-color: #18181b;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 900; color: #E50914; cursor: pointer; letter-spacing: 1px; }
    
    .search-box { flex: 1; max-width: 480px; display: flex; background: #121214; border: 1px solid #3f3f46; border-radius: 20px; overflow: hidden; margin: 0 10px; }
    .search-box input { flex: 1; padding: 8px 14px; background: transparent; border: none; color: #fff; font-size: 13px; outline: none; }
    .search-box button { background: #27272a; border: none; color: #a1a1aa; padding: 0 14px; cursor: pointer; }

    .header-btns { display: flex; gap: 8px; }
    .btn { padding: 7px 14px; border-radius: 18px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-red { background: #E50914; color: #fff; }
    .btn-gray { background: #27272a; color: #fff; border: 1px solid rgba(255,255,255,0.15); }
    .btn-gold { background: #f59e0b; color: #000; font-weight: bold; }
    .btn-oauth { width: 100%; border: 1px solid #3f3f46; border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .btn-google { background: #ffffff; color: #1f2937; }
    .btn-facebook { background: #1877f2; color: #ffffff; }

    .chips-bar { display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px; background: #121214; }
    .chips-bar::-webkit-scrollbar { display: none; }
    .chip { padding: 5px 12px; border-radius: 14px; background: #27272a; color: #d4d4d8; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .chip.active { background: #fff; color: #000; font-weight: bold; }

    main { flex: 1; padding: 20px; max-width: 1300px; margin: 0 auto; width: 100%; }
    .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .grid-title { font-size: 16px; font-weight: bold; }
    
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }
    .movie-card {
      background: #18181b;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.2s;
    }
    .movie-card:hover { transform: translateY(-4px); border-color: #E50914; }
    .poster-wrap { position: relative; width: 100%; aspect-ratio: 2/3; background: #27272a; }
    .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .ep-tag { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.85); color: #fbbf24; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    
    .card-info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 13px; font-weight: bold; color: #fff; line-height: 1.3; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 11px; color: #a1a1aa; margin-top: auto; }

    .modal-box { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; padding: 16px; align-items: center; justify-content: center; }
    .modal-box.active { display: flex; }
    .form-wrapper { width: 100%; max-width: 480px; background: #1c1c1f; border-radius: 12px; padding: 22px; border: 1px solid rgba(255,255,255,0.15); max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; color: #a1a1aa; font-weight: bold; }
    .form-control { width: 100%; padding: 9px 12px; border-radius: 6px; background: #27272a; border: 1px solid #3f3f46; color: #fff; font-size: 13px; outline: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .auth-tab { flex: 1; text-align: center; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: #a1a1aa; border-radius: 6px; }
    .auth-tab.active { background: #27272a; color: #fff; }

    .divider { display: flex; align-items: center; text-align: center; margin: 14px 0; color: #71717a; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #333; }
    .divider::before { margin-right: .5em; }
    .divider::after { margin-left: .5em; }

    /* Video Player Modal */
    .player-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200; padding: 16px; align-items: center; justify-content: center; }
    .player-modal.active { display: flex; }
    .player-box { width: 100%; max-width: 950px; background: #18181b; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); max-height: 92vh; display: flex; flex-direction: column; }
    .video-frame { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; flex-shrink: 0; }
    .video-frame iframe { width: 100%; height: 100%; border: none; }

    .player-content-scroll { padding: 18px 22px; overflow-y: auto; flex: 1; }
    .player-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    
    .episodes-area { margin-top: 14px; padding-top: 12px; border-top: 1px solid #27272a; }
    .episodes-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .ep-btn { background: #27272a; border: 1px solid #3f3f46; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 12.5px; cursor: pointer; transition: all 0.2s; }
    .ep-btn.active, .ep-btn:hover { background: #E50914; border-color: #E50914; font-weight: bold; }

    .comments-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid #27272a; }
    .comments-title { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .comment-form { display: flex; gap: 10px; margin-bottom: 16px; }
    .comment-input { flex: 1; padding: 8px 12px; border-radius: 8px; background: #27272a; border: 1px solid #3f3f46; color: #fff; font-size: 13px; outline: none; }
    .comment-list { display: flex; flex-direction: column; gap: 10px; }
    .comment-item { background: #222226; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
    .comment-author { font-size: 12px; font-weight: bold; color: #fbbf24; margin-bottom: 2px; }
    .comment-body { font-size: 13px; color: #e4e4e7; line-height: 1.4; }
    .comment-time { font-size: 10.5px; color: #a1a1aa; margin-top: 4px; }

    .ep-input-item { background: #222225; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #3f3f46; }
    .loading-box { text-align: center; padding: 60px 20px; color: #a1a1aa; font-size: 14px; grid-column: 1/-1; }
  </style>
</head>

    <div class
